name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y woff2
          python -m pip install fonttools

      - name: Build
        run: make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vf-distilled
          path: |
            build/*-distilled.ttf
            build/*-distilled.woff2
          if-no-files-found: error
